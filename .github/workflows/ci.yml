name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Examine Swift formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift scripts/generate-icon.swift

      - name: Build the app bundle
        env:
          LANCAPTURE_SIGNING_IDENTITY: "-"
        run: ./scripts/build-app.sh

      - name: Validate the app bundle
        run: |
          codesign --verify --deep --strict 'dist/LAN Capture.app'
          test -x 'dist/LAN Capture.app/Contents/MacOS/lancapture'
          test -f 'dist/LAN Capture.app/Contents/Resources/AppIcon.icns'
